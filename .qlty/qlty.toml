config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/.yarn/**",
    "**/*.d.ts",
    "**/assets/**",
    "**/bower_components/**",
    "**/build/**",
    "**/cache/**",
    "**/db/**",
    "**/deps/**",
    "**/dist/**",
    "**/extern/**",
    "**/external/**",
    "**/generated/**",
    "**/Godeps/**",
    "**/gradlew/**",
    "**/mvnw/**",
    "**/node_modules/**",
    "**/protos/**",
    "**/seed/**",
    "**/target/**",
    "**/templates/**",
    "**/testdata/**",
    "**/vendor/**",
    ".qlty/configs/**"
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*"
]

[runtimes.enabled]
php = "8.3"

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.25.0"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "checkov"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "php-codesniffer"
version = "4.0.4"
mode = "comment"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# phpcs 4.x returns exit code 3 when it finds issues; qlty's default
# success_codes ([0, 1]) would treat that as a plugin failure and discard the
# findings. This override accepts the 4.x codes. It lives here, not in the
# shared source.toml, because a drivers table there breaks the source's
# exported_config_paths. Only required while on phpcs 4.x.
[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

# php-cs-fixer 3.90+ accepts symfony 8, which needs PHP 8.4.1 and cannot be
# parsed by the PHP 8.3 runner. The sandbox install ignores platform
# requirements, so symfony is held on the 7.x line here. extra_packages is used
# rather than package_file because qlty ignores extra_packages when
# package_file is set on the same plugin.
[[plugin]]
name = "php-cs-fixer"
version = "3.95.25"
extra_packages = [
    "sinemacula/coding-standards@1.25.0",
    "symfony/console@^7.4",
    "symfony/event-dispatcher@^7.4",
    "symfony/filesystem@^7.4",
    "symfony/finder@^7.4",
    "symfony/options-resolver@^7.4",
    "symfony/process@^7.4",
    "symfony/stopwatch@^7.4",
    "symfony/string@^7.4",
]

[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trivy"
drivers = [
    "config",
    "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "phpstan"
version = "2.1.38"
package_file = "composer.json"
